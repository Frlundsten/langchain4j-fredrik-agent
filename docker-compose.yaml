services:

  # Ollama model server (CPU). Models are stored in the shared "ollama" volume,
  # which the Testcontainers-based tests mount too.
  ollama:
    image: ollama/ollama:0.40.13
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: makes sure the model is present. "ollama pull" downloads nothing
  # if the model is already in the volume.
  ollama-init:
    image: ollama/ollama:0.40.13
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "qwen3.5:2b"]
    restart: "no"

  # Conversation memory. Persistence disabled: memory lives only while Redis runs.
  redis:
    image: redis:8.8.4
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  ollama:
    name: ollama
